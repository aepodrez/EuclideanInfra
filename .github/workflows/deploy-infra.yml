name: Deploy (CDK)

# Replaces Terraform Cloud. This repo is the shared foundation (S3 bucket,
# VPC, ECS cluster, SNS, Step Function, Firehose, SSM contract) — no images
# or Lambda code to build, just `cdk deploy`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.AWS_ACCESS_KEY_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and synthesize
        working-directory: infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q ../tests
          npx --yes aws-cdk@2 synth

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require explicit deployment scope
        run: |
          message="$(git log -1 --format=%s)"
          scopes=0
          [[ "$message" == *'[full-infra-deploy]'* ]] && scopes=$((scopes + 1))
          [[ "$message" == *'[scoped-monthly-readiness]'* ]] && scopes=$((scopes + 1))
          [[ "$message" == *'[scoped-storage-footprint]'* ]] && scopes=$((scopes + 1))
          if [[ "$scopes" -gt 1 ]]; then
            echo 'Conflicting deployment scopes' >&2
            exit 1
          fi
          if [[ "$scopes" -ne 1 ]]; then
            echo 'Infra deployment requires an explicit scoped or full release marker' >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_ACCESS_KEY_ID_INPUT == '' && env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ env.AWS_ACCESS_KEY_ID_INPUT != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CDK app deps
        working-directory: infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: cdk deploy
        if: ${{ contains(github.event.head_commit.message, '[full-infra-deploy]') }}
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "954976294836"
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          npx --yes aws-cdk@2 deploy --require-approval never

      - name: Deploy scoped monthly readiness change set
        if: ${{ contains(github.event.head_commit.message, '[scoped-monthly-readiness]') }}
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "954976294836"
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          npx --yes aws-cdk@2 synth
          python tools/deploy_scoped_monthly.py --sha "$GITHUB_SHA" --execute
          npx --yes aws-cdk@2 deploy EuclideanMonthlyPendingAlert \
            --exclusively --require-approval never

      - name: Deploy scoped storage-footprint reporter code
        if: ${{ contains(github.event.head_commit.message, '[scoped-storage-footprint]') }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          changed="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")"
          if grep -Ev '^(\.github/workflows/deploy-infra\.yml|lambdas/storage_footprint_reporter/lambda_function\.py|tests/test_storage_footprint_reporter\.py)$' <<< "$changed" | grep -q .; then
            echo 'Scoped storage release contains unrelated paths' >&2
            exit 1
          fi
          (
            cd lambdas/storage_footprint_reporter
            zip -q /tmp/storage-footprint-reporter.zip lambda_function.py
          )
          expected="$(openssl dgst -sha256 -binary /tmp/storage-footprint-reporter.zip | openssl base64 -A)"
          aws lambda update-function-code \
            --function-name euclidean-storage-footprint-reporter \
            --zip-file fileb:///tmp/storage-footprint-reporter.zip >/dev/null
          aws lambda wait function-updated --function-name euclidean-storage-footprint-reporter
          actual="$(aws lambda get-function-configuration \
            --function-name euclidean-storage-footprint-reporter \
            --query CodeSha256 --output text)"
          test "$actual" = "$expected"
          state="$(aws lambda get-function-configuration \
            --function-name euclidean-storage-footprint-reporter \
            --query '[State,LastUpdateStatus]' --output text)"
          test "$state" = $'Active\tSuccessful'
