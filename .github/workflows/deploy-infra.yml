name: Deploy (CDK)

# Replaces Terraform Cloud. This repo is the shared foundation (S3 bucket,
# VPC, ECS cluster, SNS, Step Function, Firehose, SSM contract) — no images
# or Lambda code to build, just `cdk deploy`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.AWS_ACCESS_KEY_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and synthesize
        working-directory: infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest -q ../tests
          npx --yes aws-cdk@2 synth

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_ACCESS_KEY_ID_INPUT == '' && env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ env.AWS_ACCESS_KEY_ID_INPUT != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CDK app deps
        working-directory: infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: cdk deploy
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "954976294836"
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          npx --yes aws-cdk@2 deploy --require-approval never
